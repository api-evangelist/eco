aid: eco
name: Eco
description: >-
  Eco is a developer platform for programmable stablecoin infrastructure —
  "The Stablecoin Network That Makes Money Programmable." It provides real-time,
  non-custodial cross-chain stablecoin routing, liquidity, and orchestration
  across onchain markets through four products: Routes (intent-based cross-chain
  transfers and swaps fulfilled by competing solvers in 20-40 seconds),
  Programmable Addresses (deterministic CREATE2 deposit/withdrawal addresses with
  pre-programmed routing, via Solana Deposit Addresses and Circle Gateway),
  Programmable Transactions (single-transaction multi-contract "Sauce" execution,
  beta), and Orchestration (a composition layer over Routes, transactions, and
  compliance, beta). The Routes REST API exposes quote, intent, and solver
  operations across V1/V2/V3, requiring no authentication (a dAppID is passed in
  the request body for attribution). Eco supports 16+ chains and 240+ directional
  pairs and is used by stablecoin issuers, wallets, exchanges, payment platforms,
  DeFi protocols, treasury managers, and AI agents.
